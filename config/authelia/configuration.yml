theme: auto

authentication_backend:
  file:
    path: /config/users_database.yml

totp:
  issuer: snorlax.media

access_control:
  default_policy: two_factor

session:
  cookies:
    - domain: snorlax.media
      authelia_url: 'https://auth.snorlax.media'
      default_redirection_url: 'https://snorlax.media'
  redis:
    host: redis
    port: 6379

storage:
  postgres:
    address: tcp://database:5432
    database: authelia
    username: authelia

notifier:
  smtp:
    address: submissions://mail.privateemail.com:465
    sender: "Authelia <authelia@snorlax.media>"
