---
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  proxy:
    container_name: caddy
    logging: *logging
    networks:
      - auth
      - apps
    security_opt:
      - no-new-privileges:true
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MY_DOMAIN=${MY_DOMAIN}
      - TZ=America/Los_Angeles
    volumes:
      - /opt/dockerapps/authelia/caddy/data:/data
      - ./config/caddy:/etc/caddy:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  auth:
    container_name: auth
    logging: *logging
    networks:
      - auth
    security_opt:
      - no-new-privileges:true
    image: authelia/authelia:4
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /opt/dockerapps/authelia/config:/config
    environment:
      TZ: America/Los_Angeles
      AUTHELIA_JWT_SECRET_FILE: /config/secrets/JWT_SECRET
      AUTHELIA_SESSION_SECRET_FILE: /config/secrets/SESSION_SECRET
      AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE: /config/secrets/SMTP_PASSWORD
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/STORAGE_ENCRYPTION_KEY
      AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE: /config/secrets/STORAGE_PASSWORD
      AUTHELIA_SESSION_REDIS_PASSWORD_FILE: /config/secrets/REDIS_PASSWORD

  database:
    container_name: database
    logging: *logging
    networks:
      - auth
    security_opt:
      - no-new-privileges:true
    image: postgres:15
    restart: unless-stopped
    volumes:
      - /opt/dockerapps/authelia/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "authelia"
      TZ: America/Los_Angeles
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "authelia", "-d", "authelia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    logging: *logging
    networks:
      - auth
    security_opt:
      - no-new-privileges:true
    image: redis:7
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
    # cat-in-the-hat: re-enter docker-entrypoint.sh so it still drops to the redis user via gosu.
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server --save 60 1 --loglevel warning --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /opt/dockerapps/authelia/redis:/data

networks:
  auth: {}
  apps: {}

secrets:
  redis_password:
    file: /opt/dockerapps/authelia/config/secrets/REDIS_PASSWORD
