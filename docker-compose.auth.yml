---
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  proxy:
    container_name: caddy
    logging: *logging
    networks:
      - auth
      - apps
    security_opt:
      - no-new-privileges:true
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MY_DOMAIN=${MY_DOMAIN}
      - TZ=America/Los_Angeles
    volumes:
      - /opt/dockerapps/authelia/caddy/data:/data
      - ./config/caddy:/etc/caddy:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  auth:
    container_name: auth
    logging: *logging
    networks:
      - auth
    security_opt:
      - no-new-privileges:true
    image: authelia/authelia:4@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /opt/dockerapps/authelia/config:/config
      - ./config/authelia/configuration.yml:/config/configuration.yml:ro
    environment:
      TZ: America/Los_Angeles
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /config/secrets/JWT_SECRET
      AUTHELIA_SESSION_SECRET_FILE: /config/secrets/SESSION_SECRET
      AUTHELIA_NOTIFIER_SMTP_USERNAME: ${SMTP_USERNAME:?set in .env}
      AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE: /config/secrets/SMTP_PASSWORD
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/STORAGE_ENCRYPTION_KEY
      AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE: /config/secrets/STORAGE_PASSWORD
      AUTHELIA_SESSION_REDIS_PASSWORD_FILE: /config/secrets/REDIS_PASSWORD

  database:
    container_name: database
    logging: *logging
    networks:
      - auth
    security_opt:
      - no-new-privileges:true
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: unless-stopped
    volumes:
      # 18+ mounts the parent dir; PGDATA is /var/lib/postgresql/18/docker. Fresh dir on purpose.
      - /opt/dockerapps/authelia/postgres18:/var/lib/postgresql
    environment:
      POSTGRES_USER: "authelia"
      TZ: America/Los_Angeles
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "authelia", "-d", "authelia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    logging: *logging
    networks:
      - auth
    security_opt:
      - no-new-privileges:true
    image: redis:8@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
    # cat-in-the-hat: re-enter docker-entrypoint.sh so it still drops to the redis user via gosu.
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server --save 60 1 --loglevel warning --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - /opt/dockerapps/authelia/redis:/data

networks:
  auth: {}
  apps: {}

secrets:
  redis_password:
    file: /opt/dockerapps/authelia/config/secrets/REDIS_PASSWORD
