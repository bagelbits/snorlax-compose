---
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    logging: *logging
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1002
      - TZ=America/Los_Angeles
      - RADARR__SERVER__ALLOWEDHOSTS=radarr,radarr.${MY_DOMAIN}
    volumes:
      - /opt/dockerapps/radarr:/config
      - /media:/media
    restart: unless-stopped
  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    logging: *logging
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1002
      - TZ=America/Los_Angeles
      - SONARR__SERVER__ALLOWEDHOSTS=sonarr,sonarr.${MY_DOMAIN}
    volumes:
      - /opt/dockerapps/sonarr:/config
      - /media:/media
    restart: unless-stopped
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    logging: *logging
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1002
      - TZ=America/Los_Angeles
      - WEBUI_PORT=8123
      - TORRENTING_PORT=6881
    volumes:
      - /opt/dockerapps/qbittorrent:/config
      - /media/torrents:/media/torrents
    ports:
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    logging: *logging
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1002
      - TZ=America/Los_Angeles
      - PROWLARR__SERVER__ALLOWEDHOSTS=prowlarr,prowlarr.${MY_DOMAIN}
    volumes:
      - /opt/dockerapps/prowlarr:/config
    restart: unless-stopped
  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    logging: *logging
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1002
      - TZ=America/Los_Angeles
    volumes:
      - /opt/dockerapps/bazarr:/config
      - /media/anime:/media/anime
      - /media/tv:/media/tv
      - /media/movies:/media/movies
    restart: unless-stopped

networks:
  apps: {}
