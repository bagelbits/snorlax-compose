---
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  radarr:
    image: linuxserver/radarr:7.0.3.10918-ls328@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
    container_name: radarr
    logging: *logging
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1002
      - TZ=America/Los_Angeles
      - RADARR__SERVER__ALLOWEDHOSTS=radarr,radarr.${MY_DOMAIN}
    volumes:
      - /opt/dockerapps/radarr:/config
      - /media:/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: radarr", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  sonarr:
    image: linuxserver/sonarr:4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
    container_name: sonarr
    logging: *logging
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1002
      - TZ=America/Los_Angeles
      - SONARR__SERVER__ALLOWEDHOSTS=sonarr,sonarr.${MY_DOMAIN}
    volumes:
      - /opt/dockerapps/sonarr:/config
      - /media:/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: sonarr", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  qbittorrent:
    image: linuxserver/qbittorrent:5.3.0_v2.1.3-ls489@sha256:a8083a3337a175e84374e3c8cf34ab76566c54502a2e8580e53b6deaa5b2f619
    container_name: qbittorrent
    logging: *logging
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1002
      - TZ=America/Los_Angeles
      - WEBUI_PORT=8123
      - TORRENTING_PORT=6881
    volumes:
      - /opt/dockerapps/qbittorrent:/config
      - /media/torrents:/media/torrents
    ports:
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8123/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  prowlarr:
    image: linuxserver/prowlarr:3.0.2.5780-ls169@sha256:45117ba8439e2337a92ffe38a451a4dafc0be771754d05d88cdf102419d09646
    container_name: prowlarr
    logging: *logging
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1002
      - TZ=America/Los_Angeles
      - PROWLARR__SERVER__ALLOWEDHOSTS=prowlarr,prowlarr.${MY_DOMAIN}
    volumes:
      - /opt/dockerapps/prowlarr:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: prowlarr", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  bazarr:
    image: linuxserver/bazarr:v1.6.2-ls373@sha256:e0c5d45965242830c5eeddaafe9ae2b5e8ca3f6c01ecda9ee9364f550921dc50
    container_name: bazarr
    logging: *logging
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1002
      - TZ=America/Los_Angeles
    volumes:
      - /opt/dockerapps/bazarr:/config
      - /media/anime:/media/anime
      - /media/tv:/media/tv
      - /media/movies:/media/movies
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:6767/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  apps: {}
