---
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: socket-proxy
    logging: *logging
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    security_opt:
      - no-new-privileges:true
  homepage:
    image: gethomepage/homepage:latest
    container_name: homepage
    logging: *logging
    networks:
      - apps
      - docker-api
    security_opt:
      - no-new-privileges:true
    volumes:
      - /opt/dockerapps/homepage:/app/config # Make sure your local config directory exists
      - ./config/homepage/settings.yaml:/app/config/settings.yaml:ro
      - ./config/homepage/services.yaml:/app/config/services.yaml:ro
      - ./config/homepage/widgets.yaml:/app/config/widgets.yaml:ro
      - ./config/homepage/docker.yaml:/app/config/docker.yaml:ro
      - /opt/public/images:/app/public/images
      - /media:/media
    environment:
      - LOG_LEVEL=info
      - TZ=America/Los_Angeles
      - HOMEPAGE_ALLOWED_HOSTS=${MY_DOMAIN}
      - HOMEPAGE_VAR_SCRUTINY_KEY=${HOMEPAGE_VAR_SCRUTINY_KEY}
      - HOMEPAGE_VAR_PORTAINER_KEY=${HOMEPAGE_VAR_PORTAINER_KEY}
      - HOMEPAGE_VAR_TAUTULLI_KEY=${HOMEPAGE_VAR_TAUTULLI_KEY}
      - HOMEPAGE_VAR_OVERSEERR_KEY=${HOMEPAGE_VAR_OVERSEERR_KEY}
      - HOMEPAGE_VAR_SONARR_KEY=${SONARR_API_KEY}
      - HOMEPAGE_VAR_RADARR_KEY=${RADARR_API_KEY}
      - HOMEPAGE_VAR_BAZARR_KEY=${HOMEPAGE_VAR_BAZARR_KEY}
      - HOMEPAGE_VAR_PROWLARR_KEY=${HOMEPAGE_VAR_PROWLARR_KEY}
      - HOMEPAGE_VAR_QBITTORRENT_USERNAME=${HOMEPAGE_VAR_QBITTORRENT_USERNAME}
      - HOMEPAGE_VAR_QBITTORRENT_PASSWORD=${HOMEPAGE_VAR_QBITTORRENT_PASSWORD}
    restart: unless-stopped
  unpackerr:
    image: golift/unpackerr
    container_name: unpackerr
    logging: *logging
    networks:
      - apps
    volumes:
      - /media/torrents:/media/torrents
    restart: unless-stopped
    user: 1000:1002
    environment:
      - TZ=America/Los_Angeles
      - UN_START_DELAY=10s
      - UN_RETRY_DELAY=2m
      - UN_MAX_RETRIES=3
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/media/torrents
      - UN_SONARR_0_PROTOCOLS=torrent
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/media/torrents
      - UN_RADARR_0_PROTOCOLS=torrent
    security_opt:
      - no-new-privileges:true
  monitoring:
    image: nicolargo/glances:latest
    container_name: monitoring
    logging: *logging
    networks:
      - apps
      - docker-api
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    pid: host
    volumes:
      # Uncomment the below line if you want glances to display host OS detail instead of container's
      - /etc/os-release:/etc/os-release:ro
      - ./config/glances:/glances/conf:ro
    environment:
      - "GLANCES_OPT=-w"
      - DOCKER_HOST=tcp://socket-proxy:2375
      - TZ=America/Los_Angeles
  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    logging: *logging
    networks:
      - apps
    user: 0:0
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    environment:
      - PUID=1000
      - PGID=1002
      - TZ=America/Los_Angeles
    volumes:
      - /opt/dockerapps/scrutiny/config:/opt/scrutiny/config
      - /opt/dockerapps/scrutiny/influxdb:/opt/scrutiny/influxdb
      - /run/udev:/run/udev:ro
    devices:
      - /dev/nvme0:/dev/nvme0
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/sdc:/dev/sdc
      - /dev/sdd:/dev/sdd
      - /dev/sde:/dev/sde
      - /dev/sdf:/dev/sdf
      - /dev/sdg:/dev/sdg
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    logging: *logging
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    volumes:
      - /opt/dockerapps/portainer/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=America/Los_Angeles
    restart: unless-stopped
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    logging: *logging
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=America/Los_Angeles
    mem_limit: 2g
    restart: unless-stopped

networks:
  apps: {}
  docker-api:
    internal: true
