---
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  plex:
    image: linuxserver/plex:latest
    container_name: plex
    logging: *logging
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1002
      - TZ=America/Los_Angeles
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - /opt/dockerapps/plex:/config
      - /media/tv:/tv
      - /media/movies:/movies
      - /media/anime:/anime
      - /media/music:/music
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:32400/identity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  tautulli:
    image: linuxserver/tautulli:latest
    container_name: tautulli
    logging: *logging
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1002
      - TZ=America/Los_Angeles
    volumes:
      - /opt/dockerapps/tautulli:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8181/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
  overseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: overseerr
    logging: *logging
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1002
      - TZ=America/Los_Angeles
    volumes:
      - /opt/dockerapps/overseerr:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  apps: {}
